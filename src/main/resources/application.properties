# ---------------------------------------------------------------------
# Server. Port 5223 matches the Angular app's environment.ts, so the
# .NET, Java and Python backends are drop-in replacements for each other.
# ---------------------------------------------------------------------
server.port=5223

# ---------------------------------------------------------------------
# Supabase PostgreSQL
# Username keeps the project ref: postgres.<project-ref>
# Use port 5432 (session pooler), not 6543.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=[username]
spring.datasource.password=[password]
spring.datasource.driver-class-name=org.postgresql.Driver

# The SQL scripts own the schema, so Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Set to true while learning if you want to see the generated SQL.
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Auth. The secret must be at least 32 characters (256 bits) for HS256.
# ---------------------------------------------------------------------
jwt.secret=ertyuicvbn3456789fghj345678345678fg
jwt.issuer=InvoicePortalAPI
jwt.expiry-hours=8

# ---------------------------------------------------------------------
# Which front ends may call this API
# ---------------------------------------------------------------------
cors.allowed-origins=http://localhost:4200

springdoc.swagger-ui.path=/swagger-ui.html
